; FPS unlock: more pictures a second than the game's thirty.  The game itself
; still runs at thirty frames a second (its speed and its rules are tied to
; that); the pictures in between are made by moving every character, the
; camera and the HUD part of the way from one frame to the next.  The price
; is that what is on the screen is one frame (a thirtieth of a second) behind.
[mod]
name = FPS unlock
description = Show more than 30 pictures a second
enabled = 1

[settings]
; display   as many as the display shows (60, 120, 144 ...)
; a number: 60, 90, 120, 240 ...  (rounded to a multiple of 30)
fps = display
; 1 = wait for the display (no tearing); 0 = do not
vsync = 1
