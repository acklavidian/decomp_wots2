; Resolution: how many lines the picture is drawn with (the PS2 drew 448),
; the size of the window, and whether it takes the whole screen.
[mod]
name = Resolution
description = Draw the picture at more than the PS2's 448 lines
enabled = 1

[settings]
; window   as many lines as the window has (sharpest; follows resizing)
; a number of lines: 448 (the PS2's), 720, 1080, 1440, 2160 ...
; 2x, 3x ...   that many times the PS2's 448
internal = window
; The window when the game starts: WIDTHxHEIGHT, or "default".
window = default
; 1 = start on the whole screen (F11 switches at any time)
fullscreen = 0
