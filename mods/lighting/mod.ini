; Modern lighting: sun shadows, ambient occlusion, lantern light, bloom and a
; colour grade, drawn over the game's own lighting in the world.  Menus,
; story text and movies are left as they were.
[mod]
name = Modern lighting
description = Sun shadows, ambient occlusion, lantern light, bloom, a grade
enabled = 1

[settings]
; The sun's shadows of characters, swords and things, on the ground and on
; each other (they take the place of the game's dark blots under the feet).
shadows = 1
; The map's own geometry casts them too: carts, eaves, fences, trees.  (Its
; lighting is baked in, so this darkens what is already shaded; 0 = only
; characters and things cast.)
map_shadows = 1
shadow_strength = 1
; How dark the shadow falls on characters, against on the map (1 = as dark;
; above about 0.8 some graphics cards draw stripes where a body shades itself).
character_shadow = 0.475
; Characters and things take the light painted into the map on the ground
; under them: darker in a shaded corner, under eaves or away from a lantern,
; as the map around them is.  0 = off, 1 = fully.
character_ground_light = 1
; The ground's texture pushed about a little, so that rows of paving, planks
; and tiles do not run dead straight into the distance.  0 = off, 0.35 subtle,
; 1 clear, up to 3.  Off by default: where two ground textures meet, their
; edges no longer line up (the texture is read a little away from its place).
ground_warp = 0
; high (2048), ultra (4096), low (1024), or a number of texels
shadow_quality = high
; Bump mapping (a prototype): the map's stones, planks, tiles and ground get
; relief, their heights guessed from the textures' brightness and lit by the
; sun and the sky.  0 = off; 1 as meant, 2 strong (gritty).  bump_depth: how
; steep a step of brightness is.
bump = 0.98
bump_depth = 11.8
; The same on characters (0 = none … 1 = as strong as on the map); much
; less on skin, so faces keep smooth.
character_bump = 0.5
; God rays: shafts of light from the sun through the sky (0 = off).
god_rays = 0.6
; Un-baking (a prototype): the map relit by its own ambient light and sun,
; with the real shadows, instead of the light painted into it — so the town
; and its people are lit alike.  0 = the painted light, 1 = relit.
; unbake_exposure: how bright the relit map is.
unbake = 1
unbake_exposure = 0.44
; Weather: rain, with wet ground, puddles, splashes and the eaves dripping
; (dry under roofs).  auto = each part of each day may rain (rain_chance),
; rain = always, clear = never.  rain_amount: how hard it rains (0 … 2).
weather = auto
rain_chance = 0.3
rain_amount = 1.0
; Moods: the look by place, time of day and weather.  The settings above are
; the day out of doors; dawn (early morning), evening, night (late night) and
; indoors take over when they apply, and rain is laid over whichever it is.
; Each can set brightness, contrast, saturation, warmth, vignette, bloom, ao,
; shadow, god_rays and dust, e.g. "evening.warmth = 0.5"; what is not set is
; worked out from the day's.  Easiest in the game: F5, "Moods".  0 = off.
moods = 1
; Wind and dust: motes drifting in the air, and dust swept along the ground
; when the game's gusts blow (the same wind that swings hair and cloth).
; 0 = off, 1 as meant, 2 a dusty day.
dust = 1
; Ambient occlusion: darker corners, contact under feet and eaves.
ao = 1
ao_strength = 1
ao_radius = 0.35
; The lanterns of the night maps (and the flash of a blow) light the ground.
lanterns = 1
lantern_strength = 0.8
; The lanterns nearest the player light the characters and cast their
; shadows on the ground (up to four at a time).
lantern_shadows = 1
; Bright things glow: 0 = off.
bloom = 0.58
bloom_threshold = 0.915
; A gentle contrast curve, saturation, warmth (-1 cool … 1 warm), vignette.
grade = 1
contrast = 0.25
saturation = 1.1
warmth = 0
vignette = 0.25
