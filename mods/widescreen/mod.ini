; Widescreen: the 3D view opened out to the sides (the same height of view,
; more to the left and right), the game's own 4:3 screen — HUD, menus,
; subtitles — in the middle of it.
[mod]
name = Widescreen
description = A picture wider than the PS2's 4:3
enabled = 1

[settings]
; auto   the shape of the window (resize it, or F11 for the whole screen)
; 16:9, 16:10, 21:9, 32:9 ...  or a number such as 1.7778
aspect = auto
; edges    gauges, enemy plates and the HUD's lines of text keep to the edges
;          of the wider picture
; center   they stay where the 4:3 screen had them
hud = edges
